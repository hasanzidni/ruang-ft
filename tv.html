<style>
  :root {
    --navy: #0b1a3a; --biru: #1d4ed8; --biru-tua: #1e3a8a; --biru-muda: #eff4ff; --biru-blok: #dbeafe; --biru-garis: #93c5fd;
    --oranye: #fdba74; --oranye-tua: #c2410c; --latar: #f3f5fa; --putih: #ffffff;
    --teks: #0f172a; --teks-2: #334155; --teks-3: #475569; --teks-redup: #64748b; --garis: #e2e8f0; --garis-2: #cbd5e1;
    --hijau: #16a34a; --kuning: #d97706; --merah: #dc2626;
    --radius: 12px; --radius-besar: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--latar); color: var(--teks); font-family: Inter, system-ui, sans-serif; font-size: 14px; }
  a { color: var(--biru); text-decoration: none; } a:hover { color: var(--biru-tua); text-decoration: underline; }
  h1, h2, h3 { margin: 0; letter-spacing: -0.01em; }

  .lbl { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--teks-3); letter-spacing: .02em; }
  .fld { width: 100%; height: 44px; padding: 0 12px; border: 1px solid #d5dbe6; border-radius: 10px; background: var(--putih); font: inherit; font-size: 14px; color: var(--teks); }
  .fld:focus, .btn:focus-visible { outline: 3px solid var(--biru-garis); outline-offset: 1px; border-color: #2563eb; }
  .btn { font: inherit; cursor: pointer; height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--garis-2); background: var(--putih); color: var(--teks); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-utama { background: var(--biru); border-color: var(--biru); color: #fff; }
  .btn-teks { border: 0; background: transparent; color: var(--biru); padding: 0 6px; height: auto; }
  .kartu { background: var(--putih); border: 1px solid var(--garis); border-radius: var(--radius-besar); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #f1f5f9; color: var(--teks-2); }
  .redup { color: var(--teks-redup); }
  .tersembunyi { display: none !important; }
  .segmen { display: inline-flex; padding: 4px; gap: 4px; background: #e6eaf2; border-radius: 12px; }
  .segmen button { font: inherit; cursor: pointer; height: 40px; padding: 0 16px; border: 0; border-radius: 9px; font-weight: 600; background: transparent; color: var(--teks-3); }
  .segmen button[aria-pressed="true"] { background: #fff; color: var(--teks); box-shadow: 0 1px 3px rgba(15,23,42,.15); }
  .pesan-galat { padding: 14px 16px; border-radius: 12px; background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
  .memuat { padding: 48px; text-align: center; color: var(--teks-redup); }
  /* Logo UNY (client/logo.html, data URI). Pojok putih dipotong melingkar; cincin putih agar terlihat di latar navy. */
  /* Garis waktu sekarang di linimasa (rancangan J02/U01). */
  .garis-kini { position: absolute; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; background: #ea580c; pointer-events: none; z-index: 2; }
  .ket-kini { display: block; font-size: 13px; color: #9a3412; }
  .logo-uny { display: block; flex: none; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px #fff; object-fit: cover; }
</style>

<style>
  /* Satuan --u: 1vh di layar 16:9, tetapi ikut lebar layar bila lebih sempit (sematan, TV tegak). */
  :root { --u: min(1vh, 0.5625vw); }
  body { background: #06112a; color: #fff; overflow: hidden; }
  .layar { width: 100vw; height: 100vh; padding: calc(var(--u) * 3) calc(var(--u) * 4) calc(var(--u) * 2.5); display: flex; flex-direction: column; gap: calc(var(--u) * 2.2); }
  header { display: flex; justify-content: space-between; align-items: center; gap: calc(var(--u) * 3); }
  .merek-tv { display: flex; align-items: center; gap: calc(var(--u) * 2); min-width: 0; }
  .merek-tv .logo-uny { width: calc(var(--u) * 8); height: calc(var(--u) * 8); }
  .judul { min-width: 0; }
  .judul span { font-size: calc(var(--u) * 1.8); font-weight: 600; color: var(--oranye); letter-spacing: .08em; }
  .judul h1 { font-size: calc(var(--u) * 4); font-weight: 800; line-height: 1.15; }
  .jam { display: flex; align-items: center; gap: calc(var(--u) * 3); flex: 0 0 auto; }
  .jam b { font-size: calc(var(--u) * 7); font-weight: 800; font-variant-numeric: tabular-nums; }
  .jam small { display: block; text-align: right; font-size: calc(var(--u) * 2.4); color: #c7d2fe; }
  .tengah { flex: 1 1 auto; min-height: 0; display: flex; gap: calc(var(--u) * 2.2); }
  .grid { flex: 1 1 auto; min-width: 0; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: calc(var(--u) * 2); }
  .k { min-width: 0; min-height: 0; border-radius: calc(var(--u) * 2); background: #0f1f42; border: 2px solid #1e3a8a; overflow: hidden; display: grid; grid-template-rows: calc(var(--u) * .8) auto minmax(0, 1fr) auto; }
  .k .bilah { background: var(--w); }
  .k .atas { padding: calc(var(--u) * 1.6) calc(var(--u) * 2) 0; display: flex; flex-direction: column; gap: calc(var(--u) * .4); min-width: 0; }
  .k .kode { display: flex; justify-content: space-between; align-items: center; gap: var(--u); min-width: 0; }
  .k .kode b { min-width: 0; font-size: calc(var(--u) * 3.6); font-weight: 800; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k .status { flex: 0 0 auto; padding: calc(var(--u) * .5) calc(var(--u) * 1.2); border-radius: 999px; font-size: calc(var(--u) * 1.8); font-weight: 700; white-space: nowrap; background: var(--wb); color: var(--wt); }
  .k .lok { font-size: calc(var(--u) * 1.7); color: #a5b4fc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* safe center: bila isi terlalu panjang, bagian atas (nama MK) tidak ikut terpotong */
  .k .isi { min-height: 0; overflow: hidden; padding: var(--u) calc(var(--u) * 2); display: flex; flex-direction: column; justify-content: flex-start; justify-content: safe center; gap: calc(var(--u) * .7); }
  .k .isi .mk { font-size: calc(var(--u) * 3.1); font-weight: 800; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .k .isi .rinci { font-size: calc(var(--u) * 2.1); color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k .isi .dosen { font-style: normal; font-size: calc(var(--u) * 1.9); color: #c7d2fe; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .k .isi .kosong { font-size: calc(var(--u) * 2.8); font-weight: 800; color: #86efac; line-height: 1.2; }
  .k .bawah { padding: 0 calc(var(--u) * 2) calc(var(--u) * 1.6); display: flex; flex-direction: column; gap: calc(var(--u) * .8); min-width: 0; }
  .k .progres { height: calc(var(--u) * .8); border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
  .k .progres div { height: 100%; background: var(--w); }
  .k .waktu { font-size: calc(var(--u) * 1.8); color: #cbd5e1; }
  .k .berikut { padding-top: calc(var(--u) * .9); border-top: 1px solid rgba(255,255,255,.12); font-size: calc(var(--u) * 1.9); line-height: 1.3; color: #cbd5e1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .k .berikut b { color: #fff; }
  aside { flex: 0 0 24%; min-width: 0; display: flex; flex-direction: column; gap: calc(var(--u) * 2); }
  aside section { border-radius: calc(var(--u) * 2); padding: calc(var(--u) * 2) calc(var(--u) * 2.2); display: flex; flex-direction: column; gap: calc(var(--u) * 1.4); min-width: 0; }
  aside h2 { font-size: calc(var(--u) * 2.3); color: var(--oranye); }
  .segera { background: #0f1f42; border: 2px solid #1e3a8a; }
  .segera .baris { display: flex; gap: calc(var(--u) * 1.4); align-items: baseline; min-width: 0; }
  .segera .baris b { flex: 0 0 auto; font-size: calc(var(--u) * 2.2); font-variant-numeric: tabular-nums; }
  .segera .baris span { min-width: 0; font-size: calc(var(--u) * 2.1); line-height: 1.25; font-weight: 600; }
  .segera .baris small { display: block; font-size: calc(var(--u) * 1.7); font-weight: 400; color: #a5b4fc; }
  .info { background: #3b1d0b; border: 2px solid var(--oranye-tua); font-size: calc(var(--u) * 1.9); color: #fed7aa; }
  footer { display: flex; justify-content: space-between; gap: calc(var(--u) * 2); flex-wrap: wrap; font-size: calc(var(--u) * 1.7); color: #94a3b8; }
  .leg { display: flex; flex-wrap: wrap; gap: var(--u) calc(var(--u) * 2.5); }
  .leg span { white-space: nowrap; }
  .leg span::before { content: ''; display: inline-block; width: calc(var(--u) * 1.1); height: calc(var(--u) * 1.1); border-radius: 50%; margin-right: calc(var(--u) * .6); background: var(--c); }

  /* TV tegak / layar sempit: kartu 2 kolom x 3 baris, "Segera dimulai" pindah ke bawah. */
  @media (orientation: portrait) {
    :root { --u: min(0.75vh, 1vw); }
    header { flex-direction: column; align-items: flex-start; }
    .jam { width: 100%; justify-content: space-between; flex-direction: row-reverse; }
    .tengah { flex-direction: column; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); }
    aside { flex: 0 0 auto; flex-direction: row; }
    aside section { flex: 1 1 0; }
  }
</style>
</head>

<!-- util.html — Helper JavaScript klien bersama. -->
<script>
  /**
   * Aksi yang hanya MEMBACA data: aman dicoba ulang bila koneksi gagal.
   * Aksi yang menyimpan (mis. pemesanan.buat) TIDAK dicoba ulang, karena server mungkin sudah menyimpan
   * walau jawabannya tidak sampai — mengulang bisa membuat data ganda.
   */
  const AKSI_BACA = new Set(['publik.jadwal', 'publik.tv', 'profil', 'beranda', 'pilihan', 'notifikasi.daftar', 'master.daftar', 'master.riwayat',
    'ruang.detail', 'pengajuan.daftar', 'pengajuan.detail', 'entri.terbit', 'revisi.daftar', 'linimasa', 'ketersediaan', 'pemesanan.daftar',
    'penutupan.rancang', 'penutupan.daftar', 'laporan', 'impor.format', 'impor.pratinjau', 'impor.daftar', 'kesehatan', 'arsip.calon', 'audit.daftar']);
  const ULANG_JEDA = [1500, 4000];   // jeda sebelum percobaan ke-2 dan ke-3 (ms)
  const BATAS_TUNGGU = 30000;        // permintaan baca yang tak berjawab 30 detik dianggap gagal
  const PESAN_KONEKSI = 'Gagal terhubung ke server. Muat ulang halaman ini. Bila masih gagal, buka di jendela Incognito/Private, ' +
    'atau keluar dari akun Google lain di browser ini: login beberapa akun Google sekaligus sering membuat aplikasi Google Apps Script gagal memuat.';

  /** Satu kali panggil server. Galat koneksi ditandai e.koneksi = true (bisa dicoba ulang). */
  function panggilSekali_(aksi, input, batas) {
    return new Promise((selesai, gagal) => {
      let beres = false;
      const tunda = batas ? setTimeout(() => { if (beres) return; beres = true; const e = new Error('Server tidak menjawab.'); e.koneksi = true; gagal(e); }, batas) : null;
      const akhiri = (fn, v) => { if (beres) return; beres = true; if (tunda) clearTimeout(tunda); fn(v); };
      google.script.run
        .withSuccessHandler((r) => (r && r.ok ? akhiri(selesai, r.data) : akhiri(gagal, new Error((r && r.galat || []).map((g) => g.pesan).join(' ') || 'Gagal memuat data.'))))
        .withFailureHandler((e) => { const g = new Error(e && e.message ? e.message : 'Koneksi gagal.'); g.koneksi = true; akhiri(gagal, g); })
        .api(aksi, input || {});
    });
  }

  /**
   * Panggil aksi server (lihat AKSI di src/server/api.js) dan kembalikan Promise berisi `data`.
   * Galat aturan dari server ({ok:false, galat}) ditolak sebagai Error berisi pesan pengguna, tanpa diulang.
   * Galat KONEKSI pada aksi baca dicoba ulang sampai 3 kali; opsi.saatUlang(ke, total) dipanggil sebelum tiap ulangan.
   * Bila tetap gagal: Error berisi PESAN_KONEKSI dengan e.koneksi = true (tampilGalat menambahkan tombol Muat ulang).
   */
  async function panggil(aksi, input, opsi) {
    opsi = opsi || {};
    const baca = AKSI_BACA.has(aksi);
    for (let ke = 1; ; ke++) {
      try {
        return await panggilSekali_(aksi, input, baca ? BATAS_TUNGGU : 0);
      } catch (e) {
        if (!e.koneksi) throw e;
        if (!baca || ke > ULANG_JEDA.length) {
          const akhir = new Error(PESAN_KONEKSI + (e.message ? ' (' + e.message + ')' : ''));
          akhir.koneksi = true;
          throw akhir;
        }
        if (opsi.saatUlang) opsi.saatUlang(ke + 1, ULANG_JEDA.length + 1);
        await new Promise((r) => setTimeout(r, ULANG_JEDA[ke - 1]));
      }
    }
  }

  /** Escape teks untuk disisipkan ke HTML. */
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /** '07:30' -> '07.30' */
  function jamTeks(j) { return String(j || '').replace(':', '.'); }

  /** Waktu sekarang di WIB: { tanggal: 'YYYY-MM-DD', hari: 1–7 (1 = Senin), menit sejak 00.00, teks: '10.15' }. */
  function waktuWib() {
    const p = {};
    new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', weekday: 'short', hour12: false })
      .formatToParts(new Date()).forEach((x) => { p[x.type] = x.value; });
    const jam = Number(p.hour) % 24, mnt = Number(p.minute);
    return { tanggal: p.year + '-' + p.month + '-' + p.day, hari: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].indexOf(p.weekday) + 1,
      menit: jam * 60 + mnt, teks: String(jam).padStart(2, '0') + '.' + String(mnt).padStart(2, '0') };
  }
  /** Posisi waktu sekarang pada skala jam pelajaran (kolom sama lebar, rancangan J02/U01). null bila di luar jam kuliah. */
  function posisiKini(jamPelajaran, w) {
    w = w || waktuWib();
    const keMenit = (t) => { const a = String(t).split(':'); return Number(a[0]) * 60 + Number(a[1]); };
    for (const j of jamPelajaran || []) {
      const m0 = keMenit(j.mulai), m1 = keMenit(j.selesai) + 1;
      if (w.menit >= m0 && w.menit < m1) return { persen: ((j.jam_ke - 1) + (w.menit - m0) / (m1 - m0)) / jamPelajaran.length * 100, jamKe: j.jam_ke, teks: w.teks };
    }
    return null;
  }
  /** Garis oranye waktu sekarang (dipasang di dalam baris berposisi relative). */
  function garisKini(pos) { return pos ? '<div class="garis-kini" aria-hidden="true" style="left:' + pos.persen.toFixed(2) + '%"></div>' : ''; }
  function keteranganKini(pos, tambahan) {
    return pos ? '<span class="ket-kini">Garis oranye menandai waktu sekarang (' + pos.teks + ' WIB, jam ke-' + pos.jamKe + ').' + (tambahan ? ' ' + tambahan : '') + '</span>' : '';
  }
  /** Geser garis & keterangan setiap menit tanpa memuat ulang halaman. */
  function pantauGarisKini(jamPelajaranFn, tambahan) {
    setInterval(() => {
      const pos = posisiKini(jamPelajaranFn());
      document.querySelectorAll('.garis-kini').forEach((el) => { if (pos) el.style.left = pos.persen.toFixed(2) + '%'; el.style.display = pos ? '' : 'none'; });
      document.querySelectorAll('.ket-kini').forEach((el) => { if (pos) el.outerHTML = keteranganKini(pos, tambahan); else el.style.display = 'none'; });
    }, 60000);
  }

  /** Unik + urut. */
  function unik(arr) { return Array.from(new Set(arr.filter(Boolean))).sort((a, b) => String(a).localeCompare(String(b), 'id')); }

  /** Isi <select> dengan pilihan; opsi pertama "Semua …". */
  function isiPilihan(sel, label, pilihan) {
    const nilai = sel.value;
    sel.innerHTML = '<option value="">' + esc(label) + '</option>' +
      pilihan.map((p) => typeof p === 'string' ? '<option>' + esc(p) + '</option>' : '<option value="' + esc(p.v) + '">' + esc(p.t) + '</option>').join('');
    sel.value = nilai;
  }

  /** Tampilkan galat di elemen target. */
  function tampilGalat(el, e) {
    el.innerHTML = '<div class="pesan-galat">' + esc(e.message || e) +
      (e && e.koneksi ? '<div style="margin-top:10px"><button class="btn" type="button" onclick="location.reload()">Muat ulang</button></div>' : '') + '</div>';
  }
</script>

<script>
(function () {
  const WARNA = {
    dipakai: ['#38bdf8', 'rgba(56,189,248,.16)', '#bae6fd', 'Sedang dipakai'],
    segera: ['#fbbf24', 'rgba(251,191,36,.16)', '#fde68a', 'Segera dipakai'],
    kosong: ['#4ade80', 'rgba(74,222,128,.14)', '#bbf7d0', 'Kosong'],
    ditutup: ['#f87171', 'rgba(248,113,113,.16)', '#fecaca', 'Ditutup']
  };
  const PER_HALAMAN = 6;
  const $ = (id) => document.getElementById(id);
  let data = null, halaman = [], indeks = 0;
  // ?kelompok=Laboratorium%20%26%20bengkel untuk mengunci satu kelompok di satu TV
  const kunciKelompok = ({ param: Object.fromEntries(new URLSearchParams(location.search)) }).param.kelompok || '';

  const jamRentang = (e) => jamTeks(data.jamPelajaran[e.jamMulai - 1].mulai) + '–' + jamTeks(data.jamPelajaran[e.jamSelesai - 1].selesai);
  const namaDosen = (e) => e.dosen.map((d) => d.nama || d.kode).join('; ');

  function susunHalaman() {
    halaman = [];
    data.kelompok.filter((k) => !kunciKelompok || k.nama === kunciKelompok).forEach((k) => {
      for (let i = 0; i < k.kartu.length; i += PER_HALAMAN) halaman.push({ nama: k.nama, kartu: k.kartu.slice(i, i + PER_HALAMAN) });
    });
    if (indeks >= halaman.length) indeks = 0;
  }

  function kartuHtml(k) {
    const s = k.status, w = WARNA[s.status];
    let isi = '', bawah = '';
    if (s.status === 'ditutup') isi = '<b class="mk">Tidak dapat digunakan</b><span class="rinci">' + esc(s.ditutup.label) + '</span>';
    else if (s.kini) {
      isi = '<b class="mk">' + esc(s.kini.mk) + '</b><span class="rinci">' + jamRentang(s.kini) + ' · ' + esc(s.kini.rombel + (s.kini.kelompok ? ' kel. ' + s.kini.kelompok : '')) + '</span><i class="dosen">' + esc(namaDosen(s.kini)) + '</i>';
      bawah = s.status === 'dipakai'
        ? '<div class="progres"><div style="width:' + s.progres + '%"></div></div><small class="waktu">Selesai ' + jamTeks(data.jamPelajaran[s.kini.jamSelesai - 1].selesai) + ' · ' + s.sisaMenit + ' menit lagi</small>'
        : '<small class="waktu" style="color:#fde68a">Mulai dalam ' + s.mulaiDalam + ' menit</small>';
    } else isi = '<b class="kosong">' + (s.berikut ? 'Kosong hingga ' + jamTeks(data.jamPelajaran[s.berikut.jamMulai - 1].mulai) : 'Kosong hingga akhir hari') + '</b>';
    const berikut = s.status === 'ditutup' ? 'tidak ada jadwal' : (s.berikut ? jamTeks(data.jamPelajaran[s.berikut.jamMulai - 1].mulai) + ' ' + esc(s.berikut.mk) : 'tidak ada jadwal lagi hari ini');
    return '<article class="k" style="--w:' + w[0] + ';--wb:' + w[1] + ';--wt:' + w[2] + ';border-color:' + (s.status === 'kosong' ? '#1e3a8a' : w[0]) + '">' +
      '<div class="bilah"></div><div class="atas"><div class="kode"><b>' + esc(k.ruang.id) + '</b><span class="status">' + w[3] + '</span></div><span class="lok">' + esc(k.ruang.lokasi || k.ruang.nama) + '</span></div>' +
      '<div class="isi">' + isi + '</div><div class="bawah">' + bawah + '<div class="berikut"><b>Berikutnya</b> · ' + berikut + '</div></div></article>';
  }

  function tampil() {
    if (!halaman.length) { $('grid').innerHTML = '<p style="font-size:calc(var(--u) * 2.6)">Tidak ada ruang untuk ditampilkan.</p>'; return; }
    const h = halaman[indeks];
    $('judul').textContent = h.nama + ' · Departemen PTE';
    $('grid').innerHTML = h.kartu.map(kartuHtml).join('');
    $('halaman').textContent = 'Halaman ' + (indeks + 1) + ' dari ' + halaman.length + ' · diperbarui setiap ' + data.muatUlangDetik + ' detik';
    $('segera').innerHTML = data.segera.slice(0, 4).map((e) => '<div class="baris"><b>' + jamTeks(data.jamPelajaran[e.jamMulai - 1].mulai) + '</b><span>' + esc(e.mk) + '<small>' + esc(e.ruangId + ' · ' + e.rombel) + '</small></span></div>').join('') || '<span style="color:#a5b4fc">Tidak ada jadwal berikutnya hari ini.</span>';
    $('info').innerHTML = data.pengumuman.map((p) => '<p style="margin:0 0 var(--u)">' + esc(p) + '</p>').join('');
    $('infoKotak').classList.toggle('tersembunyi', !data.pengumuman.length);
  }

  function muat() {
    panggil('publik.tv').then((d) => {
      data = d; $('tanggal').textContent = d.waktu.tanggalTeks + (d.jamKe ? ' · jam ke-' + d.jamKe : '');
      susunHalaman(); tampil();
    }).catch((e) => { $('grid').innerHTML = '<p style="font-size:calc(var(--u) * 2.2);color:#fecaca">' + esc(e.koneksi ? 'Koneksi ke server terputus.' : e.message) + ' Mencoba lagi…</p>'; });
  }

  function detikJam() {
    const n = new Date();
    $('jam').textContent = String(n.getHours()).padStart(2, '0') + '.' + String(n.getMinutes()).padStart(2, '0');
  }

  muat(); detikJam();
  setInterval(detikJam, 10000);
  setInterval(muat, 60000);
  setInterval(() => { if (halaman.length > 1) { indeks = (indeks + 1) % halaman.length; tampil(); } }, 15000);
})();
</script>
</body>
